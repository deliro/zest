[package]
name = "zest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A lightweight read-only dashboard for Linux hosts"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.102"
axum = { version = "=0.8.9", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "=0.3.34", default-features = false }
hyper = { version = "=1.10.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["service", "tokio"] }
maud = "=0.27.0"
nix = { version = "=0.31.3", default-features = false, features = ["net"] }
rustix = { version = "=1.1.6", features = ["fs", "mm", "param"] }
socket2 = "=0.6.5"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt", "sync", "time"] }

[profile.release]
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1

[lints.rust]
warnings = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
fallible_impl_from = "deny"
match_same_arms = "deny"
match_wildcard_for_single_variants = "deny"
if_not_else = "deny"
needless_continue = "deny"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
clone_on_copy = "deny"
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
